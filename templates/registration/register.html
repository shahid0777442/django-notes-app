{% extends "base.html" %}
{% block title %}Sign up · Notes{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Create account</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Sign up</button>
  </form>
  <p class="muted">Already registered? <a href="{% url 'login' %}">Log in</a></p>
</div>
{% endblock %}
