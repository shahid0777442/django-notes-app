{% extends "base.html" %}
{% block title %}Delete note · Notes{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Delete note?</h1>
  <p>“{{ object.title }}” will be permanently deleted.</p>
  <form method="post">
    {% csrf_token %}
    <button class="btn danger" type="submit">Yes, delete</button>
    <a class="btn ghost" href="{{ object.get_absolute_url }}">Cancel</a>
  </form>
</div>
{% endblock %}
