{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Notes{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<header class="topbar">
  <a class="brand" href="{% url 'note-list' %}">📝 Notes</a>
  <nav>
    {% if user.is_authenticated %}
      <span class="muted">{{ user.username }}</span>
      <a class="btn" href="{% url 'note-create' %}">+ New note</a>
      <form method="post" action="{% url 'logout' %}" class="inline">
        {% csrf_token %}<button class="btn ghost" type="submit">Log out</button>
      </form>
    {% else %}
      <a class="btn ghost" href="{% url 'login' %}">Log in</a>
      <a class="btn" href="{% url 'register' %}">Sign up</a>
    {% endif %}
  </nav>
</header>
<main class="container">
  {% if messages %}
    {% for m in messages %}<div class="flash {{ m.tags }}">{{ m }}</div>{% endfor %}
  {% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
